name: SpinalHDL interfaces

on:
  push:
  pull_request:

jobs:
  scala-and-dpi:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Install Verilator
        run: sudo apt-get update && sudo apt-get install -y verilator g++ make
      - name: Compile and test Scala, RTL and DPI
        run: sbt compile test
      - name: Check Makefile generation entry
        run: make difftest_verilog NOOP_HOME="$GITHUB_WORKSPACE" BUILD_DIR="$GITHUB_WORKSPACE/build/make-rv32" XLEN=32
